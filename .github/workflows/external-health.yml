name: external-health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onecent-external-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public health and unpaid payment challenge
        shell: bash
        run: |
          set -euo pipefail
          base=https://1cent.maxzoa.ru
          ua=onecent-smoke/github-health
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          health_code=$(curl -A "$ua" --fail --silent --show-error \
            --output "$work/health" --write-out '%{http_code}' "$base/health")
          test "$health_code" = 200
          grep -q '"status":"ok"' "$work/health"

          status_code=$(curl -A "$ua" --fail --silent --show-error \
            --output "$work/status" --write-out '%{http_code}' "$base/status.json")
          test "$status_code" = 200
          grep -q '"network":"eip155:8453"' "$work/status"

          demo_code=$(curl -A "$ua" --fail --silent --show-error \
            --output "$work/demo" --write-out '%{http_code}' "$base/v1/demo/pulse")
          test "$demo_code" = 200
          grep -q '"network_request_performed":false' "$work/demo"

          code=$(curl -A "$ua" --silent --show-error --dump-header "$work/headers" \
            --output "$work/body" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com/","fresh":false}' \
            "$base/v1/url/status")
          test "$code" = 402
          grep -qi '^payment-required:' "$work/headers"
          payment_required=$(sed -n \
            's/^[Pp][Aa][Yy][Mm][Ee][Nn][Tt]-[Rr][Ee][Qq][Uu][Ii][Rr][Ee][Dd]:[[:space:]]*//p' \
            "$work/headers" | tr -d '\r' | tail -1)
          test -n "$payment_required"
          PAYMENT_REQUIRED="$payment_required" python - <<'PY'
          import base64
          import json
          import os

          encoded = os.environ["PAYMENT_REQUIRED"]
          payload = json.loads(
              base64.urlsafe_b64decode(encoded + "=" * (-len(encoded) % 4))
          )
          accepts = payload["accepts"]
          assert any(
              item["network"] == "eip155:8453"
              and item["amount"] == "1000"
              and item["asset"].lower()
              == "0x833589fcd6edb6e08f4c7c32d4f71b54bda02913"
              and item["payTo"].lower()
              == "0x4798e8401ba3b1566685257c82d06303ab90ea35"
              for item in accepts
          )
          PY
          echo external_health=PASS
