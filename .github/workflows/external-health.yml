name: external-health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onecent-external-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public health and unpaid payment challenge
        shell: bash
        run: |
          set -euo pipefail
          base=https://1cent.maxzoa.ru
          ua=onecent-smoke/github-health
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          health_code=$(curl -A "$ua" --fail --silent --show-error \
            --output "$work/health" --write-out '%{http_code}' "$base/health")
          test "$health_code" = 200
          grep -q '"status":"ok"' "$work/health"

          status_code=$(curl -A "$ua" --fail --silent --show-error \
            --output "$work/status" --write-out '%{http_code}' "$base/status.json")
          test "$status_code" = 200
          grep -q '"network":"eip155:8453"' "$work/status"

          demo_code=$(curl -A "$ua" --fail --silent --show-error \
            --output "$work/demo" --write-out '%{http_code}' "$base/v1/demo/pulse")
          test "$demo_code" = 200
          grep -q '"network_request_performed":false' "$work/demo"

          code=$(curl -A "$ua" --silent --show-error --dump-header "$work/headers" \
            --output "$work/body" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com/","fresh":false}' \
            "$base/v1/url/status")
          test "$code" = 402
          grep -qi '^payment-required:' "$work/headers"
          grep -q 'eip155:8453' "$work/body"
          echo external_health=PASS
