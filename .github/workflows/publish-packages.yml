name: publish-packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref containing the release version"
        required: true
        default: "v0.7.0"
      registry:
        description: "Registry to publish"
        required: true
        type: choice
        options:
          - pypi
          - npm

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.registry }}-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  publish-pypi:
    if: inputs.registry == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --disable-pip-version-check build==1.3.0 twine==6.2.0
          python -m build
          python -m twine check dist/*
      - name: Publish to PyPI through OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  publish-npm:
    if: inputs.registry == 'npm'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/onecent-buyer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Test package
        run: |
          npm ci
          npm test
          npm pack --dry-run
          npm audit --omit=dev --audit-level=high
      - name: Publish to npm through OIDC
        run: npm publish --access public
