[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "onecent"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1", "uvicorn[standard]==0.35.0", "httpx==0.28.1",
  "pydantic-settings==2.10.1", "sqlalchemy[asyncio]==2.0.43",
  "asyncpg==0.30.0", "alembic==1.16.5", "aiogram==3.22.0",
  "beautifulsoup4==4.13.5", "dnspython==2.8.0", "orjson==3.11.3",
  "structlog==25.4.0", "lxml==6.0.1", "trafilatura==2.0.0",
  "tldextract==5.3.0", "lxml-html-clean==0.4.3"
  , "async-timeout==4.0.3"
  , "x402[fastapi,httpx,evm,extensions]==2.16.0"
  , "jsonschema==4.25.1"
  , "mcp==1.28.1"
  , "pydantic==2.11.7"
  , "starlette==0.47.3"
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.1.0", "respx==0.22.0", "ruff==0.12.12", "mypy==1.17.1", "coverage==7.10.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP017"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501", "E702"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["onecent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
