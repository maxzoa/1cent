[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "onecent"
version = "0.8.1"
description = "Pay-per-call SSRF-safe web intelligence for AI agents through MCP and x402."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "maxzoa" }]
maintainers = [{ name = "maxzoa" }]
keywords = [
  "mcp", "model-context-protocol", "x402", "web-intelligence",
  "url-analysis", "ssrf-protection", "base-mainnet", "usdc",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: FastAPI",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.2", "uvicorn[standard]==0.35.0", "httpx==0.28.1",
  "pydantic-settings==2.10.1", "sqlalchemy[asyncio]==2.0.43",
  "asyncpg==0.30.0", "alembic==1.16.5", "aiogram==3.30.0", "aiohttp==3.14.3",
  "beautifulsoup4==4.13.5", "dnspython==2.8.0", "orjson==3.11.9",
  "structlog==25.4.0", "lxml==6.1.1", "trafilatura==2.0.0",
  "tldextract==5.3.0", "lxml-html-clean==0.4.5"
  , "async-timeout==4.0.3"
  , "pywin32==312; sys_platform == 'win32'"
  , "uvloop==0.22.1; sys_platform != 'win32' and implementation_name == 'cpython'"
  , "x402[fastapi,httpx,evm,extensions]==2.17.0"
  , "jsonschema==4.25.1"
  , "mcp==2.0.0"
  , "pydantic==2.11.7"
  , "starlette==1.3.1"
  , "cryptography==50.0.0"
]

[project.optional-dependencies]
buyer = [
  "keyring==25.7.0",
  "secretstorage==3.5.0; sys_platform == 'linux'",
  "jeepney==0.9.0; sys_platform == 'linux'",
  "uvloop==0.22.1; implementation_name == 'cpython' and sys_platform != 'win32'",
]
dev = [
  "pytest==9.1.1", "pytest-asyncio==1.4.0", "respx==0.22.0",
  "ruff==0.12.12", "mypy==1.17.1", "coverage==7.10.6",
  "pip-audit==2.9.0", "pip-tools==7.6.0", "pip==26.1.2"
]

[project.scripts]
onecent = "onecent.buyer_cli:main"
onecent-glama = "onecent.glama_stdio:main"

[project.urls]
Homepage = "https://1cent.maxzoa.ru"
Documentation = "https://1cent.maxzoa.ru/docs/getting-started"
Repository = "https://github.com/maxzoa/1cent"
Issues = "https://github.com/maxzoa/1cent/issues"
Changelog = "https://github.com/maxzoa/1cent/blob/main/CHANGELOG.md"
"MCP endpoint" = "https://1cent.maxzoa.ru/mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onecent = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP017"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501", "E702"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["onecent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
